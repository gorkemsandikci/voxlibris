name: testler

# Şimdilik sadece elle (Actions sekmesi → testler → Run workflow). Hesaptaki GitHub faturalama kilidi kalkınca
# otomatik çalıştırmak için aşağıya `push:` ve `pull_request:` eklenebilir. Testler yerelde de koşar:
#   python -m unittest discover -s tests -t .
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Paketler
        # Testler sahte ses motoru kullanır; Piper ve ses modeli gerekmez.
        run: python -m pip install pypdfium2 qrcode
      - name: Testler
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -t . -v
